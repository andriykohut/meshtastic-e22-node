<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="830" viewBox="0 0 1200 830" font-family="DejaVu Sans, Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#000"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d40000"/>
    </marker>
  </defs>
  <rect width="1200" height="830" fill="#ffffff"/>

  <text x="24" y="32" font-size="20" font-weight="bold">Meshtastic node &#8212; power section</text>
  <text x="24" y="52" font-size="12" fill="#555">2P 18650 &#183; TP4056 &#183; TPS63020 buck-boost &#183; battery sense divider &#183; GPS power switch</text>

  <!-- ===== BAND 1 ===== -->
  <text x="24" y="84" font-size="13" font-weight="bold" fill="#005a9c">1 &#8212; Charge and convert</text>

  <rect x="40" y="106" width="92" height="46" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="86" y="127" font-size="11" text-anchor="middle">USB-C 5 V</text>
  <text x="86" y="142" font-size="10" text-anchor="middle" fill="#555">charge in</text>
  <line x1="132" y1="124" x2="230" y2="124" stroke="#b00000" stroke-width="1.8"/>
  <line x1="132" y1="144" x2="230" y2="144" stroke="#000" stroke-width="1.8"/>

  <rect x="230" y="90" width="150" height="190" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="305" y="166" font-size="13" text-anchor="middle" font-weight="bold">TP4056</text>
  <text x="305" y="182" font-size="10" text-anchor="middle" fill="#555">1S Li-ion charger</text>
  <text x="305" y="197" font-size="10" text-anchor="middle" fill="#555">1 A, stock R3</text>
  <text x="236" y="120" font-size="10">IN+</text>
  <text x="236" y="140" font-size="10">IN&#8722;</text>
  <text x="236" y="216" font-size="10">B+</text>
  <text x="236" y="241" font-size="10">B&#8722;</text>
  <text x="374" y="120" font-size="10" text-anchor="end">OUT+</text>
  <text x="374" y="246" font-size="10" text-anchor="end">OUT&#8722;</text>

  <rect x="40" y="175" width="120" height="45" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="194" font-size="11" text-anchor="middle">BT1 18650</text>
  <text x="100" y="209" font-size="9" text-anchor="middle" fill="#555">protected</text>
  <rect x="40" y="240" width="120" height="45" fill="#fff" stroke="#333" stroke-width="1.5"/>
  <text x="100" y="259" font-size="11" text-anchor="middle">BT2 18650</text>
  <text x="100" y="274" font-size="9" text-anchor="middle" fill="#555">protected</text>
  <text x="167" y="192" font-size="12" fill="#b00000" font-weight="bold">+</text>
  <text x="167" y="257" font-size="12" fill="#b00000" font-weight="bold">+</text>
  <text x="32" y="192" font-size="12" text-anchor="end">&#8722;</text>
  <text x="32" y="257" font-size="12" text-anchor="end">&#8722;</text>

  <line x1="160" y1="197" x2="185" y2="197" stroke="#b00000" stroke-width="1.8"/>
  <line x1="160" y1="262" x2="185" y2="262" stroke="#b00000" stroke-width="1.8"/>
  <line x1="185" y1="197" x2="185" y2="262" stroke="#b00000" stroke-width="1.8"/>
  <line x1="185" y1="220" x2="230" y2="220" stroke="#b00000" stroke-width="1.8"/>
  <circle cx="185" cy="220" r="3" fill="#b00000"/>

  <line x1="40" y1="197" x2="20" y2="197" stroke="#000" stroke-width="1.8"/>
  <line x1="40" y1="262" x2="20" y2="262" stroke="#000" stroke-width="1.8"/>
  <line x1="20" y1="197" x2="20" y2="312" stroke="#000" stroke-width="1.8"/>
  <line x1="20" y1="312" x2="215" y2="312" stroke="#000" stroke-width="1.8"/>
  <line x1="215" y1="312" x2="215" y2="245" stroke="#000" stroke-width="1.8"/>
  <line x1="215" y1="245" x2="230" y2="245" stroke="#000" stroke-width="1.8"/>
  <text x="24" y="336" font-size="9" fill="#555">B&#8722; is the protected side of the cells &#8212; it is NOT system ground. Do not bridge it to OUT&#8722;.</text>

  <line x1="380" y1="124" x2="420" y2="124" stroke="#b00000" stroke-width="1.8"/>
  <circle cx="422" cy="124" r="3.5" fill="#fff" stroke="#b00000" stroke-width="1.5"/>
  <line x1="424" y1="122" x2="462" y2="103" stroke="#b00000" stroke-width="1.8"/>
  <circle cx="466" cy="124" r="3.5" fill="#fff" stroke="#b00000" stroke-width="1.5"/>
  <line x1="470" y1="124" x2="620" y2="124" stroke="#b00000" stroke-width="1.8"/>
  <text x="444" y="90" font-size="11" text-anchor="middle">SW1</text>
  <text x="444" y="76" font-size="9" text-anchor="middle" fill="#555">rocker ON/OFF</text>

  <line x1="380" y1="250" x2="392" y2="250" stroke="#000" stroke-width="1.8"/>
  <line x1="392" y1="250" x2="392" y2="350" stroke="#000" stroke-width="1.8"/>
  <line x1="392" y1="350" x2="900" y2="350" stroke="#000" stroke-width="3"/>
  <text x="908" y="354" font-size="11" font-weight="bold">GND</text>

  <circle cx="540" cy="124" r="3" fill="#b00000"/>
  <line x1="540" y1="124" x2="540" y2="182" stroke="#b00000" stroke-width="1.8"/>
  <rect x="494" y="182" width="92" height="24" rx="4" fill="#fff5f5" stroke="#b00000" stroke-width="1.2"/>
  <text x="540" y="199" font-size="11" text-anchor="middle" fill="#b00000" font-weight="bold">VBAT_SW</text>
  <text x="540" y="222" font-size="9" text-anchor="middle" fill="#555">continues in band 2</text>

  <rect x="620" y="85" width="180" height="110" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="710" y="120" font-size="13" text-anchor="middle" font-weight="bold">TPS63020</text>
  <text x="710" y="137" font-size="10" text-anchor="middle" fill="#555">buck-boost module</text>
  <text x="710" y="155" font-size="10" text-anchor="middle" fill="#b00000" font-weight="bold">set VOUT = 3.30 V first</text>
  <text x="710" y="172" font-size="9" text-anchor="middle" fill="#555">Vin 1.8&#8211;5.5 V</text>
  <text x="626" y="120" font-size="10">VIN</text>
  <text x="794" y="120" font-size="10" text-anchor="end">VOUT</text>
  <text x="722" y="190" font-size="10">GND</text>
  <line x1="710" y1="195" x2="710" y2="350" stroke="#000" stroke-width="1.8"/>
  <circle cx="710" cy="350" r="3" fill="#000"/>
  <circle cx="392" cy="350" r="3" fill="#000"/>

  <line x1="800" y1="124" x2="900" y2="124" stroke="#d40000" stroke-width="3" marker-end="url(#arwr)"/>
  <text x="908" y="120" font-size="12" font-weight="bold" fill="#d40000">+3V3</text>
  <text x="908" y="136" font-size="9" fill="#555">continues in band 2</text>

  <text x="410" y="252" font-size="10" fill="#005a9c">SW1 sits after the charger, so the pack</text>
  <text x="410" y="266" font-size="10" fill="#005a9c">still charges with the node switched off.</text>

  <line x1="24" y1="380" x2="1176" y2="380" stroke="#ccc" stroke-width="1" stroke-dasharray="6 4"/>

  <!-- ===== BAND 2 ===== -->
  <text x="24" y="404" font-size="13" font-weight="bold" fill="#005a9c">2 &#8212; Battery sense, 3.3 V rail, decoupling and GPS switch</text>

  <!-- divider sub-panel -->
  <rect x="80" y="424" width="112" height="24" rx="4" fill="#fff5f5" stroke="#b00000" stroke-width="1.2"/>
  <text x="136" y="441" font-size="11" text-anchor="middle" fill="#b00000" font-weight="bold">VBAT_SW</text>
  <line x1="136" y1="448" x2="136" y2="478" stroke="#000" stroke-width="1.5"/>
  <rect x="124" y="478" width="24" height="52" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="156" y="508" font-size="10">R1 100k 1%</text>
  <line x1="136" y1="530" x2="136" y2="562" stroke="#000" stroke-width="1.5"/>
  <circle cx="136" cy="556" r="3" fill="#000"/>
  <rect x="124" y="562" width="24" height="52" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <text x="156" y="592" font-size="10">R2 100k 1%</text>
  <line x1="136" y1="614" x2="136" y2="670" stroke="#000" stroke-width="1.5"/>
  <line x1="136" y1="556" x2="212" y2="556" stroke="#000" stroke-width="1.5"/>
  <circle cx="212" cy="556" r="3" fill="#000"/>
  <line x1="212" y1="556" x2="212" y2="606" stroke="#000" stroke-width="1.5"/>
  <line x1="198" y1="606" x2="226" y2="606" stroke="#000" stroke-width="1.8"/>
  <line x1="198" y1="618" x2="226" y2="618" stroke="#000" stroke-width="1.8"/>
  <line x1="212" y1="618" x2="212" y2="670" stroke="#000" stroke-width="1.5"/>
  <text x="234" y="616" font-size="10">C4 100n</text>
  <line x1="212" y1="556" x2="300" y2="556" stroke="#000" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="308" y="560" font-size="10">GPIO1 (BATTERY_PIN)</text>
  <text x="80" y="466" font-size="9" fill="#555">divides 4.2 V &#8594; 2.1 V</text>

  <!-- 3v3 rail -->
  <text x="452" y="446" font-size="12" font-weight="bold" fill="#d40000" text-anchor="end">+3V3</text>
  <line x1="460" y1="450" x2="1140" y2="450" stroke="#d40000" stroke-width="3"/>
  <text x="24" y="674" font-size="12" font-weight="bold">GND</text>
  <line x1="80" y1="670" x2="1140" y2="670" stroke="#000" stroke-width="3"/>
  <text x="80" y="690" font-size="9" fill="#555">same net as the GND rail in band 1</text>

  <!-- decoupling -->
  <g stroke="#000" stroke-width="1.5">
    <line x1="520" y1="450" x2="520" y2="540"/>
    <line x1="506" y1="540" x2="534" y2="540" stroke-width="1.8"/>
    <line x1="506" y1="552" x2="534" y2="552" stroke-width="1.8"/>
    <line x1="520" y1="552" x2="520" y2="670"/>
    <line x1="620" y1="450" x2="620" y2="540"/>
    <line x1="606" y1="540" x2="634" y2="540" stroke-width="1.8"/>
    <line x1="606" y1="552" x2="634" y2="552" stroke-width="1.8"/>
    <line x1="620" y1="552" x2="620" y2="670"/>
    <line x1="720" y1="450" x2="720" y2="540"/>
    <line x1="706" y1="540" x2="734" y2="540" stroke-width="1.8"/>
    <line x1="706" y1="552" x2="734" y2="552" stroke-width="1.8"/>
    <line x1="720" y1="552" x2="720" y2="670"/>
  </g>
  <text x="498" y="534" font-size="11" text-anchor="end" fill="#b00000" font-weight="bold">+</text>
  <text x="540" y="546" font-size="10">C1 470&#181;</text>
  <text x="540" y="560" font-size="9" fill="#555">10 V low-ESR</text>
  <text x="640" y="546" font-size="10">C2 10&#181;</text>
  <text x="640" y="560" font-size="9" fill="#555">25 V X7R</text>
  <text x="740" y="546" font-size="10">C3 100n</text>
  <text x="740" y="560" font-size="9" fill="#555">50 V X7R</text>
  <circle cx="520" cy="450" r="3" fill="#d40000"/>
  <circle cx="620" cy="450" r="3" fill="#d40000"/>
  <circle cx="720" cy="450" r="3" fill="#d40000"/>
  <circle cx="520" cy="670" r="3" fill="#000"/>
  <circle cx="620" cy="670" r="3" fill="#000"/>
  <circle cx="720" cy="670" r="3" fill="#000"/>

  <!-- load taps -->
  <g stroke="#d40000" stroke-width="1.8">
    <line x1="560" y1="450" x2="560" y2="418" marker-end="url(#arwr)"/>
    <line x1="660" y1="450" x2="660" y2="418" marker-end="url(#arwr)"/>
    <line x1="770" y1="450" x2="770" y2="418" marker-end="url(#arwr)"/>
  </g>
  <text x="560" y="410" font-size="10" text-anchor="middle">DevKitC 3V3</text>
  <text x="660" y="410" font-size="10" text-anchor="middle">E22 VCC</text>
  <text x="770" y="410" font-size="10" text-anchor="middle">OLED VCC</text>
  <circle cx="560" cy="450" r="3" fill="#d40000"/>
  <circle cx="660" cy="450" r="3" fill="#d40000"/>
  <circle cx="770" cy="450" r="3" fill="#d40000"/>

  <!-- Q1 -->
  <rect x="820" y="500" width="140" height="80" fill="#f4f4f4" stroke="#333" stroke-width="1.5"/>
  <text x="890" y="530" font-size="12" text-anchor="middle" font-weight="bold">Q1 AO3401A</text>
  <text x="890" y="546" font-size="10" text-anchor="middle" fill="#555">P-channel</text>
  <text x="890" y="562" font-size="9" text-anchor="middle" fill="#555">GPIO6 LOW = GPS on</text>
  <text x="896" y="494" font-size="10">S</text>
  <text x="966" y="537" font-size="10">G</text>
  <text x="896" y="598" font-size="10">D</text>
  <line x1="890" y1="500" x2="890" y2="450" stroke="#d40000" stroke-width="1.8"/>
  <circle cx="890" cy="450" r="3" fill="#d40000"/>
  <line x1="960" y1="540" x2="1030" y2="540" stroke="#000" stroke-width="1.5" marker-end="url(#arw)"/>
  <text x="1038" y="544" font-size="10">GPIO6 (PIN_GPS_EN)</text>
  <circle cx="990" cy="540" r="3" fill="#000"/>
  <line x1="990" y1="540" x2="990" y2="522" stroke="#000" stroke-width="1.5"/>
  <rect x="978" y="470" width="24" height="52" fill="#fff" stroke="#000" stroke-width="1.5"/>
  <line x1="990" y1="470" x2="990" y2="450" stroke="#000" stroke-width="1.5"/>
  <circle cx="990" cy="450" r="3" fill="#d40000"/>
  <text x="1010" y="500" font-size="10">R3 100k</text>
  <line x1="890" y1="580" x2="890" y2="620" stroke="#000" stroke-width="1.8"/>
  <line x1="890" y1="620" x2="1000" y2="620" stroke="#000" stroke-width="1.8" marker-end="url(#arw)"/>
  <text x="1008" y="624" font-size="10">GPS VCC (switched)</text>

  <!-- notes -->
  <rect x="24" y="712" width="1152" height="100" fill="#fbfbf5" stroke="#ccc" stroke-width="1"/>
  <text x="40" y="732" font-size="11" font-weight="bold">Before you connect anything</text>
  <text x="40" y="752" font-size="10">1. Set the TPS63020 to 3.30 V with a multimeter, output unloaded. 5 V on this rail destroys the ESP32-S3, E22 and GPS at once.</text>
  <text x="40" y="770" font-size="10">2. Charge both cells individually and balance to within 50 mV before wiring them in parallel.</text>
  <text x="40" y="788" font-size="10">3. Switch SW1 OFF whenever USB is plugged into the DevKitC, or the external rail fights the board's onboard regulator.</text>
  <text x="40" y="806" font-size="10">4. C1&#8211;C3 all belong at the E22's VCC pad, within 10 mm. C4 belongs at the GPIO1 pin.</text>
</svg>
