
[env:esp32s3-e22-433]
extends = esp32s3_base
board = esp32-s3-devkitc-1
board_level = extra
board_build.flash_size = 16MB          ; match your WROOM-1 part (N8R8 / N16R8)
build_flags =
  ${esp32s3_base.build_flags}
  -I variants/esp32s3-e22-433
  -D ARDUINO_USB_CDC_ON_BOOT=1
  -D ARDUINO_USB_MODE=1
